[package]
name = "naansentinels-server"
version = "0.1.0"
edition = "2021"
description = "Serveur de NaAnSentinels : comptes, rôles, signal de présence facultatif et tableau de bord."
license = "MIT"
authors = ["Noam Lellouche"]

[[bin]]
name = "naansentinels-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
rpassword = "7"
